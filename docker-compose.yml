# Two ways to use this file:
#
#   npm run redis:up     just Redis, with the API running on the host via `npm run dev`.
#                        The everyday loop — hot reload, no image rebuild.
#
#   npm run docker:up    the whole thing in containers — web + api + redis, close to what
#                        deploys. Use it to check the images work and the three talk to each
#                        other before pushing. (In production the web app is on Vercel and
#                        the API on Railway/Fly — docs/frontend.md §9, docs/backend.md §8 —
#                        so this is a local end-to-end demo, not the deploy topology.)
#
# The API also runs with no Redis at all: with REDIS_URL unset the cache degrades to a
# pass-through and GET /api/health reports "redis": "disabled".

services:
  web:
    build:
      # Repo root, not apps/web — npm workspace, same reason as the API below.
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: booking-code-web
    restart: unless-stopped
    ports:
      # 3001 on the host (the API already holds 3000); the container listens on 3000.
      - '${WEB_PORT:-3001}:3000'
    environment:
      NODE_ENV: production
      # `api`, not localhost: Server Components and Server Actions fetch this from inside the
      # compose network. This is the one value that cannot be copied from apps/web/.env.
      API_URL: http://api:3000
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    # Reaps zombies and forwards SIGTERM to the Next server (PID 1) on redeploy.
    init: true

  api:
    build:
      # Repo root, not apps/api — this is an npm workspace and the install needs the root
      # lockfile plus every workspace manifest.
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: booking-code-api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      # `redis`, not localhost: inside the compose network the service name is the hostname.
      # This is the one value that cannot be copied from apps/api/.env.
      REDIS_URL: redis://redis:6379
      # Four Betway hosts, not one — betting API, reference data, odds feed (docs/betway-api.md §1).
      BETWAY_BASE_URL: ${BETWAY_BASE_URL:-https://www.betway.com.ng/appsynapse/bet-api-sr}
      BETWAY_CONFIG_URL: ${BETWAY_CONFIG_URL:-https://config.betwayafrica.com}
      BETWAY_FEEDS_URL: ${BETWAY_FEEDS_URL:-https://feeds-roa2.betwayafrica.com/br/_apis/sport/v1}
      BETWAY_APIC_URL: ${BETWAY_APIC_URL:-https://apic.betwayafrica.com}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:3001}
      PORT: 3000
    depends_on:
      redis:
        # Waits for the healthcheck below, not merely for the container to exist — otherwise
        # the API can start against a Redis that has not finished booting.
        condition: service_healthy
    # Reaps zombies and forwards signals. src/index.ts handles SIGTERM to drain in-flight
    # requests; this makes sure it actually arrives.
    init: true

  redis:
    image: redis:7-alpine
    container_name: booking-code-redis
    restart: unless-stopped
    ports:
      # Published so `npm run dev` on the host can reach it too.
      - '6379:6379'
    # No persistence, deliberately. Redis here is a cache and nothing in it is meant to
    # survive a restart (docs/backend.md §5) — writing an RDB would imply otherwise.
    command: redis-server --save '' --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
